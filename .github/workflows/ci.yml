name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le second build réutilise l'étape builder du premier (cache local du job).
      - run: docker build --target server -t idk-server .
      - run: docker build --target client -t idk-client .
      - run: docker run --rm idk-server --help
      - run: docker run --rm idk-client --help
      - run: docker run --rm idk-server --version
      - run: docker run --rm idk-client --version
